name: Sektordaten aktualisieren

on:
  schedule:
    # Yahoo-Kurse macht der Cloudflare-Worker STÜNDLICH. Diese Action deckt
    # zwei getrennte Takte ab (Details in scripts/update-sectors.mjs):
    #   • PERLENSUCHE  — rund alle 12 h, AUCH am Wochenende (wie früher).
    #   • Finnhub-Scan, Markt-News, Inflationsprognose — nur 1× pro WERKTAG,
    #     da sich am Wochenende keine Kurse bewegen.
    # Daher wieder Slots an allen sieben Tagen; welcher Teil tatsächlich läuft,
    # entscheidet das Skript über scan.heavyAt (12 h) bzw. scan.heavyDay (Tag).
    # Je Zeitfenster zwei Slots als Reserve gegen GitHubs Cron-Jitter.
    - cron: '13 6,18 * * *'
    - cron: '43 9,21 * * *'
  workflow_dispatch:         # manueller Start möglich
    inputs:
      force_heavy:
        description: 'Vollen Lauf erzwingen (Gemini+Finnhub, ignoriert 6h-Takt)'
        type: boolean
        default: false
      debug:
        description: 'Gemini-Debug-Logging (rohe Antworten/Verwerfungsgründe)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sektordaten aktualisieren (Yahoo + Finnhub + Gemini)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Taktet die PERLENSUCHE (~2×/Tag). Der Kurs-/News-Teil hängt
          # zusätzlich an scan.heavyDay und läuft nur 1× pro Werktag.
          # 0 = beides manuell erzwingen.
          HEAVY_GAP_H: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_heavy) && '0' || '12' }}
          GEMINI_DEBUG: ${{ (github.event_name == 'workflow_dispatch' && inputs.debug) && '1' || '' }}
        run: node scripts/update-sectors.mjs

      - name: Tagesschlusskurse auffrischen
        env:
          # Vier Läufe am Tag × 120 = jede der ~390 Aktien einmal täglich.
          PRICES_BUDGET: '120'
        run: node scripts/prices-daily.mjs || echo "Kursreihen übersprungen."

      - name: Änderungen committen
        run: |
          if git diff --quiet sectordata.json history.json; then
            echo "Keine Änderungen."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sectordata.json history.json
            git commit -m "Sektordaten aktualisiert ($(date -u +%Y-%m-%d))"
            # bis zu 3 Versuche: bei parallelem Push (z. B. manueller Commit) erst rebasen
            for i in 1 2 3; do
              if git push; then break; fi
              echo "Push abgelehnt – rebase und erneut versuchen ($i)…"
              git pull --rebase -X ours origin main || git rebase --abort
            done
          fi

      # Die Kursreihen (~1 MB) landen NICHT auf main: sie ändern sich jeden
      # Handelstag komplett, das wären über 100 MB Git-Historie im Jahr für
      # Daten, deren alte Stände niemand braucht. Stattdessen ein eigener
      # Zweig mit genau EINEM Commit, der jedes Mal überschrieben wird.
      - name: Kursreihen veröffentlichen (Zweig `prices`, ohne Historie)
        if: always()
        run: |
          if [ ! -s prices.json ]; then
            echo "Keine prices.json – übersprungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp prices.json "$RUNNER_TEMP/prices.json"
          git worktree add --detach "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          # Eindeutiger Zweigname: `--orphan prices` scheitert, sobald der
          # Zweig lokal schon existiert (z. B. nach einem fetch).
          git checkout --orphan pricespub-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/prices.json" prices.json
          git add prices.json
          git commit -m "Kursreihen ($(date -u +%Y-%m-%d))"
          git push -f origin HEAD:prices
